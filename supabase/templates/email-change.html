<!-- Sujet : Confirme ta nouvelle adresse BrewAtHome -->
<!-- À coller dans Supabase : Authentication → Emails → Templates → « Change Email Address ». -->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #0f172a">
  <p style="font-size: 22px; font-weight: 700; margin: 0 0 16px">🍺 BrewAtHome</p>
  <p style="margin: 0 0 20px">Confirme le changement d'adresse de ton compte, de {{ .Email }} vers {{ .NewEmail }}.</p>
  <p style="margin: 0 0 24px">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; font-weight: 600; padding: 12px 24px; border-radius: 999px">Confirmer la nouvelle adresse</a>
  </p>
  <p style="margin: 0; font-size: 13px; color: #64748b">Tu n'as rien demandé ? Ignore simplement cet e-mail.</p>
</div>
